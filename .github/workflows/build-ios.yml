name: Build iOS IPA

on:
  push:
    branches: [ main, feature/ios-port ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 0.2.436)'
        required: true
        default: '0.2.436'
      version_code:
        description: 'Version Code (e.g. 436009)'
        required: true
        default: '436009'

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-ccache-${{ runner.os }}
          max-size: 2G

      - name: Restore Cached Mono iOS Library
        id: cache-mono-lib
        uses: actions/cache/restore@v4
        with:
          path: ios/libs/libmonosgen-2.0.a
          key: ios-mono-v1-${{ hashFiles('scripts/build-ios-mono.sh', 'patches/mono/**') }}

      - name: Restore Cached Godot iOS Library
        id: cache-godot-lib
        uses: actions/cache/restore@v4
        with:
          path: ios/libs/libgodot.ios.template_release.arm64.a
          key: ios-godot-v1-${{ hashFiles('scripts/build-godot-ios.sh', 'patches/godot/**') }}

      - name: Install SCons & Ninja
        if: steps.cache-godot-lib.outputs.cache-hit != 'true' || steps.cache-mono-lib.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade pip
          pip install scons ninja

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Setup Godot Source
        if: steps.cache-godot-lib.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-godot-source.sh

      - name: Build Mono Runtime for iOS (ios-arm64)
        if: steps.cache-mono-lib.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-ios-mono.sh

      - name: Save Mono iOS Library to Cache
        if: steps.cache-mono-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/libs/libmonosgen-2.0.a
          key: ${{ steps.cache-mono-lib.outputs.cache-primary-key }}

      - name: Build Godot Engine for iOS
        if: steps.cache-godot-lib.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-godot-ios.sh

      - name: Save Godot iOS Library to Cache
        if: steps.cache-godot-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/libs/libgodot.ios.template_release.arm64.a
          key: ${{ steps.cache-godot-lib.outputs.cache-primary-key }}

      - name: Build STS2Launcher iOS & Package IPA
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '0.2.436' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '436009' }}"
          ./scripts/build-ios-local.sh "$VERSION_NAME" "$VERSION_CODE"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS2Launcher-iOS
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/*.sha256
          if-no-files-found: error
