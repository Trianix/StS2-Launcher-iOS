name: Build iOS IPA

on:
  push:
    branches: [ main, feature/ios-port ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 0.2.436)'
        required: true
        default: '0.2.436'
      version_code:
        description: 'Version Code (e.g. 436009)'
        required: true
        default: '436009'

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/cache@v4
        with:
          path: tmp/ios-deps
          key: ios-managed-refs-v1-436
      - name: Stage managed reference assemblies
        run: bash scripts/prepare-ios-managed-refs.sh
      - name: Build and verify managed behavior
        run: |
          dotnet build tests/STS2Mobile.GameIdentityTests/STS2Mobile.GameIdentityTests.csproj -c Release -p:SourceRevisionId=${{ github.sha }}
          dotnet tests/STS2Mobile.GameIdentityTests/bin/Release/net9.0/STS2Mobile.GameIdentityTests.dll
      - name: Verify gameplay save isolation and synchronization
        shell: pwsh
        run: ./scripts/test-local-gameplay-save-safety.ps1
      - name: Verify native cache invalidation
        run: |
          python3 scripts/test-ios-native-fingerprint.py
          python3 scripts/test-write-ios-runtime-manifest.py
          python3 scripts/test-runtime-investigation-packaging.py
          python3 scripts/test-apply-godot-patches.py
      - name: Verify pinned Mono interpreter return packing
        run: python3 scripts/test-ios-mono-returns.py --download
      - name: Install pinned desktop Godot for behavior checks
        run: |
          curl -fSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -o tmp/godot-mono.zip
          unzip -q tmp/godot-mono.zip -d tmp/godot-mono
          dotnet nuget add source "$PWD/tmp/godot-mono/Godot_v4.5.1-stable_mono_linux_x86_64/GodotSharp/Tools/nupkgs" --name Godot-local
          dotnet build tools/LauncherUiPreview/LauncherUiPreview.csproj -c Debug -p:SourceRevisionId=${{ github.sha }}
      - name: Verify engine-hosted gameplay contracts
        shell: pwsh
        run: |
          ./scripts/test-gameplay-stabilization.ps1 -GodotPath tmp/godot-mono/Godot_v4.5.1-stable_mono_linux_x86_64/Godot_v4.5.1-stable_mono_linux.x86_64 -ManagedRuntimeDirectory tmp/ios-deps/gameplay-runtime -GameAssemblyPath tmp/ios-deps/gameplay-runtime/sts2.dll -SkipBuild
      - name: Upload gameplay preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-preflight-${{ github.sha }}
          path: artifacts/gameplay-stabilization/
          if-no-files-found: warn
      - name: Verify consolidated runtime fixtures on desktop
        shell: pwsh
        run: |
          ./scripts/test-gameplay-stabilization.ps1 -GodotPath tmp/godot-mono/Godot_v4.5.1-stable_mono_linux_x86_64/Godot_v4.5.1-stable_mono_linux.x86_64 -ManagedRuntimeDirectory tmp/ios-deps/gameplay-runtime -GameAssemblyPath tmp/ios-deps/gameplay-runtime/sts2.dll -SkipBuild -RuntimeInvestigation
      - name: Upload runtime investigation preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-investigation-preflight-${{ github.sha }}
          path: artifacts/runtime-investigation/
          if-no-files-found: error

  build-ios:
    needs: validate-managed
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-ccache-${{ runner.os }}
          max-size: 2G

      - name: Identify native toolchain
        id: toolchain
        run: echo "id=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Cached Mono iOS Library
        id: cache-mono-lib
        uses: actions/cache/restore@v4
        with:
          path: ios/libs/libmonosgen-2.0.a*
          key: ios-mono-v2-${{ steps.toolchain.outputs.id }}-${{ hashFiles('scripts/build-ios-mono.sh', 'scripts/ios-native-fingerprint.py', 'patches/mono/**') }}

      - name: Restore Cached Godot iOS Library
        id: cache-godot-lib
        uses: actions/cache/restore@v4
        with:
          path: ios/libs/libgodot.ios.template_release.arm64.a*
          key: ios-godot-v2-${{ steps.toolchain.outputs.id }}-${{ hashFiles('scripts/build-godot-ios.sh', 'scripts/setup-godot-source.sh', 'scripts/godot-source-utils.sh', 'scripts/apply-godot-patches.py', 'scripts/requirements-godot-build.txt', 'scripts/ios-native-fingerprint.py', 'patches/godot/**') }}

      - name: Install SCons & Ninja
        run: |
          python3 -m pip install --upgrade pip
          pip install scons ninja

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Setup Godot Source
        run: |
          ./scripts/setup-godot-source.sh

      - name: Build Mono Runtime for iOS (ios-arm64)
        if: steps.cache-mono-lib.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-ios-mono.sh

      - name: Save Mono iOS Library to Cache
        if: steps.cache-mono-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/libs/libmonosgen-2.0.a*
          key: ${{ steps.cache-mono-lib.outputs.cache-primary-key }}

      - name: Build Godot Engine for iOS
        if: steps.cache-godot-lib.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-godot-ios.sh

      - name: Build patched GodotSharp API
        run: |
          ./scripts/build-godotsharp-ios.sh

      - name: Save Godot iOS Library to Cache
        if: steps.cache-godot-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/libs/libgodot.ios.template_release.arm64.a*
          key: ${{ steps.cache-godot-lib.outputs.cache-primary-key }}

      - name: Build STS2Launcher iOS & Package IPA
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '0.2.436' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '436009' }}"
          export STS2_REQUIRE_PATCHED_GODOTSHARP=1
          ./scripts/build-ios-local.sh "$VERSION_NAME" "$VERSION_CODE"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS2Launcher-iOS-${{ github.sha }}
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/*.sha256
            artifacts/ios/gameplay-property-probe.enabled
            artifacts/ios/RUNTIME-INVESTIGATION-TESTING.md
          if-no-files-found: error
